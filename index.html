<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finish Line</title>
<meta name="color-scheme" content="dark light">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0c;--fg:#ecebe6;--mut:#7d7c78;--line:#222220;--acc:#ff6a3d;--accsoft:rgba(255,106,61,.12);--danger:#ff7b6b;
--serif:"Fraunces",Georgia,"Times New Roman",serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
[data-theme="light"]{--bg:#f5f3ee;--fg:#151513;--mut:#85827a;--line:#dedbd2;--acc:#d9431a;--accsoft:rgba(217,67,26,.1);--danger:#c0392b}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;transition:background .2s,color .2s;min-height:100vh}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
.app{max-width:1240px;margin:0 auto;padding:max(22px,env(safe-area-inset-top)) clamp(18px,4vw,48px) 56px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding-bottom:22px}
.brand{font:500 22px/1 var(--serif);letter-spacing:-.02em}
.brand i{font-style:italic;color:var(--acc)}
.link{font:12px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--mut);transition:color .15s}
.link:hover{color:var(--fg)}
form.load{display:flex;align-items:baseline;gap:14px;border-bottom:1px solid var(--line);padding-bottom:10px;transition:border-color .2s}
form.load:focus-within{border-color:var(--fg)}
.load input{flex:1;min-width:0;background:none;border:0;outline:0;font:400 20px/1.3 var(--serif);padding:6px 0}
.load input::placeholder{color:var(--mut)}
.load .go{font:12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--acc);white-space:nowrap}
.err{color:var(--danger);font-size:13px;min-height:0;padding-top:8px}
main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:clamp(24px,4vw,56px);padding-top:28px;align-items:start}
.stage{min-width:0;display:flex;flex-direction:column;gap:16px}
.video{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden}
.video iframe,.video #player{position:absolute;inset:0;width:100%;height:100%;border:0}
.empty{display:flex;flex-direction:column;justify-content:flex-end;gap:10px;height:100%;padding:clamp(20px,4vw,44px);background:transparent;border:1px solid var(--line);color:var(--mut)}
.empty h2{font:400 clamp(26px,4.2vw,46px)/1.05 var(--serif);letter-spacing:-.03em;color:var(--fg)}
.empty p{max-width:420px;font-size:14px}
.titlebar{display:flex;align-items:baseline;justify-content:space-between;gap:16px}
.titlebar[hidden],#prog[hidden],#opts[hidden]{display:none}
.titlebar h1{font:400 clamp(19px,2.4vw,26px)/1.2 var(--serif);letter-spacing:-.02em;flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.progress{height:2px;background:var(--line);position:relative}
.progress i{display:block;height:100%;width:0;background:var(--acc);transition:width .4s linear}
.meta{display:flex;justify-content:space-between;gap:10px;margin-top:10px;color:var(--mut);font:12px var(--mono);font-variant-numeric:tabular-nums}
.adnote{font:12px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--acc);display:flex;align-items:center;gap:8px;margin-top:10px}
.adnote[hidden]{display:none}
.adnote:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--acc);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.25}}
body.adon .progress i{opacity:.3}
body.adon #cur,body.adon #stampNow{color:var(--acc)}
.toast{display:none;align-items:center;justify-content:space-between;gap:14px;border-left:2px solid var(--acc);padding:6px 0 6px 14px;font-size:14px}
.toast.show{display:flex}
.opts{display:flex;gap:20px;flex-wrap:wrap;color:var(--mut);font-size:13px}
.opts label{display:inline-flex;align-items:center;gap:7px;cursor:pointer}
.opts input{accent-color:var(--acc)}
.opts select{background:none;border:0;border-bottom:1px solid var(--line);color:var(--fg);font:inherit}
aside{display:flex;flex-direction:column;gap:16px;min-width:0}
aside h3,.sessions h3{font:12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:400}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.stats{font:12px var(--mono);color:var(--mut)}
.stats b{color:var(--fg);font-weight:500}
textarea{width:100%;min-height:84px;resize:vertical;background:none;border:0;border-bottom:1px solid var(--line);padding:6px 0 10px;outline:0;font:400 17px/1.45 var(--serif);transition:border-color .2s}
textarea:focus{border-color:var(--fg)}
textarea::placeholder{color:var(--mut)}
.hint{font-size:13px;color:var(--mut)}
.hint b{font-family:var(--mono);font-weight:500;color:var(--fg)}
.btn{font:12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mut);transition:color .15s}
.btn:hover{color:var(--fg)}
.btn.primary{color:var(--acc)}
.btn.primary:hover{color:var(--fg)}
.btn.sm{font-size:11px}
.notes{display:flex;flex-direction:column;max-height:46vh;overflow:auto;border-top:1px solid var(--line)}
.note{display:flex;gap:14px;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--line)}
.note .ts{font:12px var(--mono);color:var(--acc);flex:none;width:44px;text-align:left;font-variant-numeric:tabular-nums}
.note .ts:hover{text-decoration:underline}
.note .tx{flex:1;white-space:pre-wrap;word-break:break-word;min-width:0;font:400 16px/1.45 var(--serif)}
.note .x{color:var(--mut);font-size:18px;line-height:1;padding:0 2px}
.note .x:hover{color:var(--danger)}
.tools{display:flex;gap:18px;flex-wrap:wrap}
.sessions{margin-top:56px;border-top:1px solid var(--line);padding-top:18px}
.sessions h3{margin-bottom:6px}
.srow{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.srow .open{flex:1;min-width:0;display:flex;justify-content:space-between;gap:16px;align-items:baseline;padding:13px 0;text-align:left}
.srow .t{font:400 17px/1.3 var(--serif);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .open:hover .t{color:var(--acc)}
.srow .s{font:12px var(--mono);color:var(--mut);white-space:nowrap}
.srow .s.done{color:var(--acc)}
.srow .del{color:var(--mut);font-size:18px;padding:6px 4px 6px 12px}
.srow .del:hover{color:var(--danger)}
.sr{position:absolute;left:-9999px}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
@media (max-width:900px){
  main{grid-template-columns:1fr;gap:28px;padding-top:20px}
  .notes{max-height:none}
  .load input{font-size:18px}
  .sessions{margin-top:36px}
}
@media print{
  header,form.load,.stage,.sessions,.noprint,.err{display:none!important}
  body{background:#fff;color:#000}
  main{display:block;padding:0}
  .notes{max-height:none;overflow:visible;border:0}
  .note{border-color:#ccc;break-inside:avoid}
  .note .ts{color:#000}
  .printhead{display:block!important}
}
.printhead{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand">Finish <i>line</i></div>
  <button class="link" id="themeBtn" type="button" aria-label="Switch theme">Light</button>
</header>
<form class="load" id="loadForm" autocomplete="off">
  <input id="url" type="url" inputmode="url" placeholder="Paste a YouTube link" aria-label="YouTube link">
  <button class="go" type="submit">Watch &rarr;</button>
</form>
<div class="err" id="err" role="alert"></div>

<main>
  <section class="stage">
    <div class="video" id="videoBox">
      <div class="empty" id="empty">
        <h2>One video.<br>No escape routes.</h2>
        <p>Paste a link above. You get that video and a notepad, nothing else: no feed, no suggestions.</p>
      </div>
    </div>
    <div class="titlebar" id="titlebar" hidden>
      <h1 id="vtitle">Video</h1>
      <button class="btn sm" id="doneBtn" type="button">Mark finished</button>
    </div>
    <div id="prog" hidden>
      <div class="progress"><i id="bar"></i></div>
      <div class="meta"><span id="cur">0:00</span><span id="watched">0 min watched</span><span id="dur">0:00</span></div>
      <div class="adnote" id="adnote" hidden>Ad playing &middot; timer paused</div>
    </div>
    <div class="toast" id="toast" role="status"><span id="toastTx"></span><button class="btn sm primary" id="toastOk" type="button">Keep going</button></div>
    <div class="opts" id="opts" hidden>
      <label><input type="checkbox" id="optFocus" checked> Pause if I leave this tab</label>
      <label><input type="checkbox" id="optNudge" checked> Check in every <select id="nudgeMin"><option>10</option><option selected>15</option><option>20</option><option>30</option></select> min</label>
    </div>
  </section>

  <aside id="side">
    <div class="row"><h3>Notes</h3><div class="stats"><b id="nCount">0</b> notes &middot; <b id="streak">0</b> finished</div></div>
    <textarea id="noteIn" placeholder="Write a note. Enter saves it at the current second." aria-label="Note"></textarea>
    <div class="row">
      <span class="hint">at <b id="stampNow">0:00</b></span>
      <button class="btn primary" id="addNote" type="button">Add note</button>
    </div>
    <div class="notes" id="notes"></div>
    <div class="tools noprint">
      <button class="btn sm" id="expMd" type="button">Export .md</button>
      <button class="btn sm" id="expPdf" type="button">Save as PDF</button>
      <button class="btn sm" id="copyMd" type="button">Copy</button>
    </div>
    <div class="printhead" id="printhead"></div>
  </aside>
</main>

<section class="sessions" id="sessionsWrap">
  <h3>Saved sessions</h3>
  <div id="sessions"></div>
</section>
</div>

<script>
(function(){
"use strict";
var KEY="finishline.v1";
var $=function(id){return document.getElementById(id)};
var state={sessions:{},theme:null,focus:true,nudge:true,nudgeMin:15,finished:0};
var player=null,apiReady=false,apiFailed=false,cur=null,tick=null,sittingSec=0,sinceNudge=0,pendingStart=0,mainDur=0,ad=false,lastT=0;

function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);for(var k in o)state[k]=o[k]}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
load();

/* theme */
function applyTheme(t){
  if(!t)t=(window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches)?"light":"dark";
  document.documentElement.setAttribute("data-theme",t);var tb=$("themeBtn");if(tb)tb.textContent=t==="dark"?"Light":"Dark";
}
applyTheme(state.theme);
$("themeBtn").onclick=function(){
  var t=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";
  state.theme=t;applyTheme(t);save();
};

/* url parsing */
function parseId(s){
  s=(s||"").trim();if(!s)return null;
  if(/^[A-Za-z0-9_-]{11}$/.test(s))return{id:s,t:0};
  var u;try{u=new URL(/^https?:\/\//i.test(s)?s:"https://"+s)}catch(e){return null}
  var h=u.hostname.replace(/^www\.|^m\.|^music\./,"");
  var id=null;
  if(h==="youtu.be")id=u.pathname.split("/")[1];
  else if(h==="youtube.com"||h==="youtube-nocookie.com"){
    var p=u.pathname.split("/").filter(Boolean);
    if(p[0]==="watch")id=u.searchParams.get("v");
    else if(["shorts","embed","live","v"].indexOf(p[0])>-1)id=p[1];
  }
  if(!id||!/^[A-Za-z0-9_-]{11}$/.test(id))return null;
  var t=u.searchParams.get("t")||u.searchParams.get("start")||"",sec=0;
  var m=/^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s?)?$/.exec(t);
  if(m&&t)sec=(+m[1]||0)*3600+(+m[2]||0)*60+(+m[3]||0);
  return{id:id,t:sec};
}
window.__parseId=parseId;

function fmt(s){
  s=Math.max(0,Math.floor(s||0));var h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
  var p=function(n){return n<10?"0"+n:""+n};
  return h?h+":"+p(m)+":"+p(x):m+":"+p(x);
}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function setErr(m){$("err").textContent=m||""}

/* YouTube API */
window.onYouTubeIframeAPIReady=function(){apiReady=true;if(cur&&!player)makePlayer()};
(function(){
  var s=document.createElement("script");s.src="https://www.youtube.com/iframe_api";s.async=true;
  s.onerror=function(){apiFailed=true;if(cur&&!player)fallbackEmbed()};
  document.head.appendChild(s);
  setTimeout(function(){if(!apiReady){apiFailed=true;if(cur&&!player)fallbackEmbed()}},9000);
})();

function resetVideoBox(){
  var box=$("videoBox");box.innerHTML="";
  if(player&&player.destroy){try{player.destroy()}catch(e){}}
  player=null;
  var d=document.createElement("div");d.id="player";box.appendChild(d);
}
function makePlayer(){
  resetVideoBox();
  try{
    player=new YT.Player("player",{
      host:"https://www.youtube-nocookie.com",
      videoId:cur.id,
      playerVars:{rel:0,modestbranding:1,playsinline:1,iv_load_policy:3,fs:1,start:pendingStart||0,origin:location.origin&&location.origin!=="null"&&/^https?:/.test(location.origin)?location.origin:undefined},
      events:{onReady:onReady,onStateChange:onState,onError:function(e){setErr(location.protocol==="file:"?"YouTube refuses to play embedded videos when this page is opened straight from a file (error "+e.data+"). Put this page on a web address (any free static host) and it works.":"YouTube would not play this video here (code "+e.data+"). It may block embedding or be private.")}}
    });
  }catch(e){fallbackEmbed()}
}
function fallbackEmbed(){
  if(!cur)return;
  var box=$("videoBox");box.innerHTML="";
  var f=document.createElement("iframe");
  f.src="https://www.youtube-nocookie.com/embed/"+cur.id+"?rel=0&modestbranding=1&playsinline=1&start="+(pendingStart||0);
  f.allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen";f.allowFullscreen=true;f.title="Video";
  box.appendChild(f);
  setErr("Basic mode: the video plays, but timestamps and jump-back need YouTube's player API, which did not load. Notes will stamp at 0:00 until it does.");
}
function onReady(){
  mainDur=rawDur();
  var d=player.getVideoData&&player.getVideoData();
  if(d&&d.title){cur.title=d.title;$("vtitle").textContent=d.title;document.title=d.title+" - Finish Line";remember()}
  $("dur").textContent=fmt(mainDur);
}
function onState(e){
  if(e.data===1){var d=player.getVideoData();if(d&&d.title&&cur.title!==d.title){cur.title=d.title;$("vtitle").textContent=d.title;remember()}if(!ad)$("dur").textContent=fmt(mainDur||rawDur())}
  if(e.data===0&&!ad){markDone(true)}
}

function rawTime(){try{return player&&player.getCurrentTime?player.getCurrentTime():0}catch(e){return 0}}
function rawDur(){try{return player&&player.getDuration?player.getDuration()||0:0}catch(e){return 0}}
/* Ad awareness: YouTube ads play inside the same player. While one runs, the
   player reports the ad's own length (or another video id), not this video's.
   We detect that, freeze time and progress, and stamp notes at the last real second. */
function detectAd(){
  if(!player||!cur||!player.getPlayerState)return false;
  var st;try{st=player.getPlayerState()}catch(e){return ad}
  var d=rawDur(),vd=null;try{vd=player.getVideoData&&player.getVideoData()}catch(e){}
  if(vd&&vd.video_id&&vd.video_id!==cur.id)return true;
  if(mainDur>0&&d>0&&Math.abs(d-mainDur)>2)return true;
  if(mainDur>0&&d===0&&st===1)return true;
  if(!mainDur&&d>0&&st!==-1&&st!==3)mainDur=d;
  return false;
}
function setAd(v){
  if(v===ad)return;ad=v;
  document.body.classList.toggle("adon",v);
  $("adnote").hidden=!v;
}
function curTime(){return ad?lastT:rawTime()}
function playing(){try{return !ad&&player&&player.getPlayerState&&player.getPlayerState()===1}catch(e){return false}}

/* sessions */
function remember(){
  if(!cur)return;
  var s=state.sessions[cur.id]||(state.sessions[cur.id]={id:cur.id,title:"",notes:[],pos:0,dur:0,finished:false});
  if(cur.title)s.title=cur.title;
  s.updated=Date.now();save();renderSessions();
}
function openVideo(id,t){
  setErr("");
  cur={id:id,title:(state.sessions[id]&&state.sessions[id].title)||""};
  var s=state.sessions[id];
  pendingStart=t||(s&&s.pos>5&&!s.finished?Math.floor(s.pos):0);
  sittingSec=0;sinceNudge=0;mainDur=0;lastT=pendingStart||0;setAd(false);hideToast();
  $("titlebar").hidden=false;$("prog").hidden=false;$("opts").hidden=false;
  $("vtitle").textContent=cur.title||"Loading...";
  document.title=(cur.title||"Video")+" - Finish Line";
  remember();renderNotes();syncDone();
  if(apiReady)makePlayer();else if(apiFailed)fallbackEmbed();else{resetVideoBox();$("videoBox").firstChild.style.background="#000"}
  try{history.replaceState(null,"","#"+id)}catch(e){}
  window.scrollTo({top:0,behavior:"smooth"});
}
$("loadForm").addEventListener("submit",function(e){
  e.preventDefault();
  var r=parseId($("url").value);
  if(!r){setErr("That does not look like a YouTube link. Try a watch, youtu.be or shorts link.");return}
  $("url").value="";$("url").blur();openVideo(r.id,r.t);
});

/* notes */
function sess(){return cur&&state.sessions[cur.id]}
function addNote(){
  var s=sess();if(!s)return;
  var v=$("noteIn").value.trim();if(!v)return;
  var t=Math.floor(curTime());
  s.notes.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),t:t,text:v});
  s.notes.sort(function(a,b){return a.t-b.t});
  $("noteIn").value="";s.updated=Date.now();save();renderNotes();renderSessions();
  var n=$("notes");n.scrollTop=n.scrollHeight;
}
$("addNote").onclick=addNote;
$("noteIn").addEventListener("keydown",function(e){
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();addNote()}
});
$("noteIn").addEventListener("focus",updateStamp);
function renderNotes(){
  var s=sess(),box=$("notes");box.innerHTML="";
  var list=s?s.notes:[];
  $("nCount").textContent=list.length;
  $("streak").textContent=state.finished||0;
  if(!list.length){box.innerHTML='<div class="hint">No notes yet. Pause on a good moment and write one. Click a time to jump back to it.</div>'}
  list.forEach(function(n){
    var d=document.createElement("div");d.className="note";
    d.innerHTML='<button class="ts" type="button" title="Jump to this moment">'+fmt(n.t)+'</button><div class="tx">'+esc(n.text)+'</div><button class="x" type="button" aria-label="Delete note">&times;</button>';
    d.querySelector(".ts").onclick=function(){seek(n.t)};
    d.querySelector(".x").onclick=function(){s.notes=s.notes.filter(function(m){return m.id!==n.id});save();renderNotes();renderSessions()};
    box.appendChild(d);
  });
}
function seek(t){try{if(player&&player.seekTo){player.seekTo(t,true);player.playVideo()}}catch(e){}}
window.__seek=seek;

/* finish */
function syncDone(){var s=sess();$("doneBtn").textContent=s&&s.finished?"Finished \u2713":"Mark finished"}
function markDone(auto){
  var s=sess();if(!s)return;
  if(!s.finished){s.finished=true;state.finished=(state.finished||0)+1}
  else if(!auto){s.finished=false;state.finished=Math.max(0,(state.finished||0)-1)}
  save();syncDone();renderNotes();renderSessions();
  if(s.finished)showToast("You finished it. Export your notes before you close the tab.","Export",function(){exportMd()});
}
$("doneBtn").onclick=function(){markDone(false)};

/* progress loop */
setInterval(function(){
  if(!cur||!player){updateStamp();return}
  setAd(detectAd());
  var d=mainDur||rawDur();
  if(!ad){lastT=rawTime()}
  var t=lastT;
  updateStamp();
  if(d){$("bar").style.width=Math.min(100,t/d*100)+"%";$("dur").textContent=fmt(d)}
  $("cur").textContent=fmt(t);
  var s=sess();if(s&&!ad&&t>0){s.pos=t;s.dur=d;if(Math.floor(t)%5===0)save()}
  if(playing()){
    sittingSec++;sinceNudge++;
    $("watched").textContent=Math.floor(sittingSec/60)+" min watched";
    if(state.nudge&&sinceNudge>=state.nudgeMin*60){
      sinceNudge=0;
      var left=d?Math.max(0,Math.round((d-t)/60)):0;
      showToast(Math.floor(sittingSec/60)+" minutes in"+(left?", about "+left+" left":"")+". Still with it? You can finish this.","Keep going",hideToast);
    }
  }
},1000);
function updateStamp(){$("stampNow").textContent=fmt(curTime())}

document.addEventListener("visibilitychange",function(){
  if(document.hidden&&state.focus&&playing()){try{player.pauseVideo()}catch(e){}}
});
$("optFocus").checked=state.focus!==false;$("optNudge").checked=state.nudge!==false;$("nudgeMin").value=String(state.nudgeMin||15);
$("optFocus").onchange=function(){state.focus=this.checked;save()};
$("optNudge").onchange=function(){state.nudge=this.checked;save()};
$("nudgeMin").onchange=function(){state.nudgeMin=+this.value;sinceNudge=0;save()};

var toastCb=null;
function showToast(msg,btn,cb){$("toastTx").textContent=msg;$("toastOk").textContent=btn;toastCb=cb;$("toast").classList.add("show")}
function hideToast(){$("toast").classList.remove("show")}
$("toastOk").onclick=function(){var c=toastCb;hideToast();if(c)c()};

/* export */
function mdText(){
  var s=sess();if(!s)return"";
  var out="# "+(s.title||"Video notes")+"\n\nhttps://youtu.be/"+s.id+"\n\n";
  s.notes.forEach(function(n){out+="- ["+fmt(n.t)+"](https://youtu.be/"+s.id+"?t="+n.t+") "+n.text.replace(/\n/g,"\n  ")+"\n"});
  return out;
}
function exportMd(){
  var s=sess();if(!s)return;
  var b=new Blob([mdText()],{type:"text/markdown"}),a=document.createElement("a");
  a.href=URL.createObjectURL(b);a.download=((s.title||"notes").replace(/[^\w\- ]+/g,"").trim().slice(0,60)||"notes")+".md";
  document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);
}
$("expMd").onclick=exportMd;
$("expPdf").onclick=function(){var s=sess();if(!s)return;$("printhead").innerHTML="<h2>"+esc(s.title||"Video notes")+"</h2><p>https://youtu.be/"+esc(s.id)+"</p>";window.print()};
$("copyMd").onclick=function(){
  var t=mdText(),b=this;
  function ok(){b.textContent="Copied";setTimeout(function(){b.textContent="Copy"},1200)}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,function(){});else{var x=document.createElement("textarea");x.value=t;document.body.appendChild(x);x.select();try{document.execCommand("copy");ok()}catch(e){}x.remove()}
};

/* sessions list */
function renderSessions(){
  var box=$("sessions");box.innerHTML="";
  var arr=Object.keys(state.sessions).map(function(k){return state.sessions[k]}).sort(function(a,b){return (b.updated||0)-(a.updated||0)});
  $("sessionsWrap").style.display=arr.length?"":"none";
  arr.forEach(function(s){
    var w=document.createElement("div");w.className="srow";
    var pct=s.dur?Math.min(100,Math.round(s.pos/s.dur*100)):0;
    var st=s.finished?"finished":(pct?pct+"%":"new");
    w.innerHTML='<button class="open" type="button"><span class="t">'+esc(s.title||("youtu.be/"+s.id))+'</span><span class="s'+(s.finished?" done":"")+'">'+s.notes.length+' notes &middot; '+st+'</span></button><button class="del" type="button" aria-label="Remove session">&times;</button>';
    w.querySelector(".open").onclick=function(){openVideo(s.id,0)};
    w.querySelector(".del").onclick=function(){if(confirm("Remove this session and its notes?")){delete state.sessions[s.id];save();if(cur&&cur.id===s.id){cur=null;location.hash="";location.reload()}else renderSessions()}};
    box.appendChild(w);
  });
}
renderSessions();renderNotes();

var h=location.hash.replace("#","");
if(/^[A-Za-z0-9_-]{11}$/.test(h))openVideo(h,0);
})();
</script>
